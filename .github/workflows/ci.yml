name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker compose build test

      - name: Run Playwright tests
        id: playwright
        run: docker compose run --rm --no-deps test
        env:
          MARCOMBOX_EMAIL: ${{ secrets.MARCOMBOX_EMAIL }}
          MARCOMBOX_PASSWORD: ${{ secrets.MARCOMBOX_PASSWORD }}
          MARCOMBOX_BASE_URL: ${{ secrets.MARCOMBOX_BASE_URL }}
          USER_FOLDER_NAME: ${{ secrets.USER_FOLDER_NAME }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() && steps.playwright.outcome != 'cancelled'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
